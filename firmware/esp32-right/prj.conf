# Right half - primary.
#
# Zephyr features this app needs switched on. Everything not listed here is
# left out of the build, which is why an embedded RTOS image stays small.

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# The FPGA link fills a ring buffer from the uart ISR; a thread drains it.
CONFIG_RING_BUFFER=y

# printk/logging over the usb console
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_MAIN_STACK_SIZE=4096
